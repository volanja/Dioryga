[package]
name = "dioryga"
description = "システム構築・運用プロジェクトのためのインフラ台帳"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dioryga"
path = "src/lib.rs"

[[bin]]
name = "dioryga"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
figment.workspace = true
entity.workspace = true
migration.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
argon2 = "0.6.0"
sha2 = "0.11.0"
base64 = "0.23.1"
getrandom = "0.4.3"
rpassword = "7.5.4"
askama = "0.16.0"
rust-embed = "8.12.0"
mime_guess = "2.0.5"
rust-i18n = "4.2.1"
# 素のHTMLフォームからのCSRFトークンを本文から読むために使う（auth::middleware）
form_urlencoded = "1.2.2"
# 一括取込（設計書23章）。カタログはYAML、インスタンスはCSV
serde_yaml_ng = "0.10.0"
csv = "1.4.0"

[dev-dependencies]
chrono.workspace = true
figment = { workspace = true, features = ["test"] }
serde_urlencoded = "0.7.1"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { workspace = true, features = ["v4"] }
# スキーマ側でblobを扱えることの確認にのみ使う。**本体への採用はSBOM取込の
# 実装時に判断する**（zstd-sysはCツールチェーンを要求し、Windowsビルドに影響する）
zstd = "0.13"

