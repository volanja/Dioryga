# 依存ライセンスの表示（THIRD-PARTY-NOTICES.txt）を生成するための設定。
#
# 単一バイナリで配布する以上、MIT・Apache-2.0・BSD等が求める著作権表示と
# ライセンス全文の保持を、バイナリ側で満たす必要がある。生成物は
# `crates/dioryga/THIRD-PARTY-NOTICES.txt` に置き、`include_str!` で埋め込む。
#
#   ./scripts/licenses.sh          生成して更新する
#   ./scripts/licenses.sh --check  既存の出力が最新かだけを確かめる

# **配布物に含まれる依存だけを対象にする。**
#
# dev-dependencies（testcontainers、zstd 等）は配布物に入らないため除外する。
# 含めると、実際には配っていないもののライセンスを表示することになり、
# 表示の意味が薄れる。
ignore-dev-dependencies = true
ignore-build-dependencies = false

accepted = [
    # 実際に検出されたものだけを並べる。**新しいライセンスが依存に入ったら
    # ここに無いため生成が失敗する**——これが検査として働く。
    # 選択肢のあるパッケージは、上にあるものが優先される。
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
]

# ターゲットを絞らないと、Windows/Linux/macOS すべての条件付き依存が
# 集まる。**配布対象がWindowsとmacOSの双方**（設計書2章）であるため、
# 両方を含める。Linuxを入れているのはCIがubuntuで検査するため。
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
