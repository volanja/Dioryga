merge:
  title: Merge catalog entries
  lead: Fold vendors and parts that were registered twice under different spellings into one
  admin_hint: Merging affects every project, so only users holding an administrator role in some project can do it
  order_hint: Work upward from the bottom. While parts or chassis models are still duplicated, merging the vendor fails on a unique constraint
  vendors: Merge vendors
  vendors_hint: Every model, contract and other row pointing at the absorbed vendor is repointed
  parts: Merge parts
  parts_hint: Only possible when the category, core count, capacity and other specs all match
  source: Absorbed
  target: Kept
  submit: Merge
