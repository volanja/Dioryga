{% extends "app_layout.html" %}
{% block title %}{{ t_title }}{% endblock %}
{% block content %}

{# 何が起きるか（行ごと消えるか、廃止になるか）を示してから実行する（#133） #}
<div class="page-head">
  <div>
    <p class="crumb"><a href="/warehouses">{{ t_back }}</a></p>
    <h1>{{ t_title }}</h1>
  </div>
</div>

<div class="card">
  <p><strong>{{ name }}</strong></p>
  <p class="lead">{{ t_lead }}</p>

  <div class="head-actions">
    {% if can_delete %}
    <form method="post" action="/warehouses/{{ warehouse_id }}/delete" class="inline">
      <input type="hidden" name="csrf_token" value="{{ chrome.csrf_token }}">
      <button type="submit" class="ghost danger">{{ t_submit }}</button>
    </form>
    {% endif %}
    <a class="button ghost" href="/warehouses">{{ t_cancel }}</a>
  </div>
</div>

{% endblock %}
