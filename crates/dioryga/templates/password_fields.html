{# パスワード変更の入力欄。強制変更の画面と個人設定の画面で共有する（#122） #}
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="current">{{ t_current }}</label>
  <input type="password" id="current" name="current_password"
         autocomplete="current-password" required>

  <label for="new">{{ t_new }}</label>
  <input type="password" id="new" name="new_password"
         autocomplete="new-password" required>

  <label for="confirm">{{ t_confirm }}</label>
  <input type="password" id="confirm" name="confirm_password"
         autocomplete="new-password" required>

  <button type="submit">{{ t_submit }}</button>
