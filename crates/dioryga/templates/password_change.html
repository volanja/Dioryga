{% extends "auth_layout.html" %}
{% block title %}{{ t_title }}{% endblock %}
{% block content %}
<h1>{{ t_title }}</h1>
<p class="lead">{{ t_lead }}</p>

{% if let Some(message) = error %}
<p class="error">{{ message }}</p>
{% endif %}

{# CSRFトークン（設計書20.5）。htmxからは同じ値を hx-headers でヘッダーに載せる #}
<form method="post" action="/account/password">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="current">{{ t_current }}</label>
  <input type="password" id="current" name="current_password"
         autocomplete="current-password" required>

  <label for="new">{{ t_new }}</label>
  <input type="password" id="new" name="new_password"
         autocomplete="new-password" required>

  <label for="confirm">{{ t_confirm }}</label>
  <input type="password" id="confirm" name="confirm_password"
         autocomplete="new-password" required>

  <button type="submit">{{ t_submit }}</button>
</form>
{% endblock %}
