name: CI

on:
  push:
    branches: [main]
    # 配布物を実際に建てて確認するため、リリースタグでも動かす（macos-build）。
    tags: ["v*"]
  pull_request:
  # 週次。環境ドリフトの検知と、普段動かさないジョブの定期実行を兼ねる。
  # 毎週月曜 06:00 JST（日曜 21:00 UTC）。
  schedule:
    - cron: "0 21 * * 0"
  # リリース前に手で回せるようにする。
  workflow_dispatch:

# 同じブランチへ続けてpushした場合、古い実行を打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CIでは差分ビルドが効かないため、デバッグ情報を削ってビルド時間を短縮する。
  CARGO_PROFILE_DEV_DEBUG: 0
  # キャッシュの保存はmainでのみ行う（rust-cacheの `save-if` へ渡す）。
  #
  # PRのpushごとに5ジョブぶん保存すると、post-stepで毎回30〜40秒かかるうえ、
  # リポジトリのキャッシュ枠を食い潰して**LRUで退避され、かえって遅くなる**。
  # PRの実行はmainのキャッシュを読めるため、復元側には影響しない。
  SAVE_CACHE_ON: refs/heads/main

jobs:
  lint:
    name: Lint (fmt / clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ツールチェーンは rust-toolchain.toml から自動で解決される。
      # ここでバージョンを書くと二重管理になるため指定しない。
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == env.SAVE_CACHE_ON }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # 開発専用の機能（dev-autologin、#128）も検査の対象に含める。
      # 付けないと、機能の中のコードが一度も lint されない
      - name: cargo clippy
        run: cargo clippy --all-targets --locked --features dioryga/dev-autologin -- -D warnings

  test:
    name: テスト＋カバレッジ
    runs-on: ubuntu-latest
    # **octocov を動かすこのジョブにだけ権限を足す**（ワークフロー全体は contents: read）。
    permissions:
      # バッジSVGを main へpushする（PRIVATEのため外部バッジサービスが使えない）
      contents: write
      # PRコメント
      pull-requests: write
      # testExecutionTime の取得
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == env.SAVE_CACHE_ON }}

      - uses: taiki-e/install-action@cargo-llvm-cov

      # **SQLite側とPostgreSQL側を同じ計装ビルドで流し、1つのカバレッジにする。**
      #
      # 別ジョブのままだと、PostgreSQL側が通る経路が数字に現れない。後から
      # LCOVを合算する形では行カバレッジしか合わず、region は片側だけになる。
      # 計装ビルドも1本で済む。
      #
      # 引き換えに、**PostgreSQLコンテナの失敗がこのジョブの失敗になる。**
      #
      # 開発専用の自動ログイン（dev-autologin、#128）のテストも流す。機能を
      # 付けないとテストごとコンパイルされない。**2つのステップで機能を揃える**
      # ——揃えないと計装ビルドが2本になる。機能は自動ログインの入口を足すだけで、
      # 使わない限り他のテストの挙動は変わらない
      - name: テスト（SQLite）
        run: cargo llvm-cov --no-report --workspace --locked --features dioryga/dev-autologin

      # testcontainers-rs がコンテナを起動する。ubuntuランナーには
      # Dockerが用意されているため追加の準備は要らない。
      - name: テスト（PostgreSQL、--ignored）
        run: cargo llvm-cov --no-report --workspace --locked --features dioryga/dev-autologin -- --ignored

      - name: カバレッジを出力する
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --json --summary-only --output-path coverage-summary.json

      # 設計書2章の通り、カバレッジ100%は目標として掲げるが閾値による
      # 失敗判定はまだ入れない。まず計測できる状態にする。
      - name: カバレッジ概要
        run: cargo llvm-cov report --summary-only

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.json

      # **分岐カバレッジは stable では出ない**（nightly の計装が要る）。代わりに
      # region と関数のカバレッジを、octocov のカスタムメトリクスとして載せる。
      # LCOV からは行カバレッジしか読めないため、llvm-cov の要約を整形して渡す
      - name: カスタムメトリクスを作る
        run: |
          jq '{
            key: "llvm_cov",
            name: "llvm-cov（region・関数）",
            metrics: [
              {key: "regions", name: "Region", value: (.data[0].totals.regions.percent * 100 | round / 100), unit: "%"},
              {key: "functions", name: "関数", value: (.data[0].totals.functions.percent * 100 | round / 100), unit: "%"}
            ]
          }' coverage-summary.json > octocov-llvm-cov.json

      # 閾値は置いていないため、このステップでジョブは落ちない（.octocov.yml）
      - uses: k1LoW/octocov-action@v1
        env:
          OCTOCOV_CUSTOM_METRICS_LLVM_COV: octocov-llvm-cov.json

  schema-docs:
    name: スキーマドキュメントの検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == env.SAVE_CACHE_ON }}

      # tblsの作者が公開している公式のアクション。版を固定する
      - uses: k1LoW/setup-tbls@v1
        with:
          version: v1.95.0

      # **ドキュメントの陳腐化とスキーマの検査を同時に行う**（設計書2章）。
      # マイグレーションを変えたのに docs/schema/ を再生成していない場合、
      # および外部キー索引の張り忘れ・テーブルコメントの欠落で落ちる。
      #
      # 直し方はスクリプトが出すメッセージの通り、ローカルで
      # `./scripts/schema-docs.sh` を実行してコミットする。
      - name: スキーマドキュメントが最新か
        run: ./scripts/schema-docs.sh --check

  licenses:
    name: 依存ライセンス表示の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == env.SAVE_CACHE_ON }}

      # 版を固定する。生成物の書式が版で変わると、依存を変えていないのに
      # 差分が出て落ちるため。
      - name: cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      # **表示の陳腐化と、新しいライセンスの混入を同時に検査する。**
      #
      # 依存を足したのに THIRD-PARTY-NOTICES.txt を再生成していない場合に落ちる。
      # about.toml の accepted に無いライセンスが入った場合も、生成自体が
      # 失敗して落ちる——GPL等が紛れ込んだことに気付ける。
      #
      # 直し方はスクリプトが出すメッセージの通り、ローカルで
      # `./scripts/licenses.sh` を実行してコミットする。
      - name: 依存ライセンスの表示が最新か
        run: ./scripts/licenses.sh --check

  windows-smoke:
    name: Windowsビルド＋起動スモークテスト
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Defenderがビルド出力を1ファイルずつ走査するため、Windowsのビルドは
      # 同じ3クレートでもmacOSの3倍の時間がかかっていた（依存はキャッシュ済み
      # であり、キャッシュを増やしても解消しない）。
      #
      # 走査を止めるのではなく、対象から外すだけ。失敗しても本題ではないため
      # ジョブは続行する（Defenderが無効な環境では例外になる）。
      - name: Defenderの走査対象からビルド出力を外す
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath `
              "${{ github.workspace }}\target", `
              "$env:USERPROFILE\.cargo"
            Write-Host "除外しました"
          } catch {
            Write-Host "除外できませんでした（続行します）: $_"
          }

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == env.SAVE_CACHE_ON }}
          # **キーにプロファイル名を混ぜる。**rust-cacheのキーは Cargo.lock と
          # 各クレートの Cargo.toml から作られ、**プロファイルを定義している
          # ルートの Cargo.toml は含まれない。**分けないと release プロファイルの
          # 依存が入ったキャッシュに完全一致し、「Cache up-to-date」で保存が
          # スキップされる。結果、ciプロファイルの依存が永久にキャッシュされず
          # 毎回フルビルドになる（実測で確認した）。
          key: profile-ci

      # 配布物ではなくスモークテスト用のため、最適化を切った ci プロファイルで
      # 建てる（理由と引き換えに失うものはルートの Cargo.toml に書いた）。
      # 本物の `--release` が通ることはMacビルド確認で担保している。
      - name: cargo build --profile ci
        run: cargo build --profile ci --locked

      # **開発専用の自動ログインが入っていないこと**（#128）。認証を迂回する入口で
      # あり、機能フラグの付け忘れ・付け間違いに気付けるよう毎回確かめる。
      # 目印は src/auth/dev_autologin.rs の MARKER
      - name: 自動ログインが含まれていないこと
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("target\ci\dioryga.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains("DIORYGA-DEV-AUTOLOGIN-ENABLED")) {
            throw "開発専用の自動ログインがバイナリに含まれています"
          }
          Write-Host "含まれていません"

      # 設計書2章：単一バイナリがWindows上で実際にサーバプロセスとして
      # 直接実行される形態のため、パス区切り・ファイルロック・静的アセット
      # 展開といったWindows固有の問題はLinux/Mac上のテストでは検出できない。
      - name: 起動してヘルスチェックと静的アセットに疎通する
        shell: pwsh
        run: |
          $exe = "target\ci\dioryga.exe"
          $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) {
                throw "プロセスが終了しました (exit code: $($proc.ExitCode))"
              }
              try {
                $res = Invoke-WebRequest -Uri "http://127.0.0.1:8080/health" `
                  -UseBasicParsing -TimeoutSec 2
                if ($res.StatusCode -eq 200) {
                  Write-Host "疎通しました: $($res.Content)"
                  $ok = $true
                  break
                }
              } catch {
                # 起動途中は接続できないため、タイムアウトまで再試行する。
              }
            }
            if (-not $ok) {
              throw "30秒以内にヘルスチェックへ応答しませんでした"
            }

            # 静的アセットがバイナリから配信されることを確かめる。
            #
            # **ヘルスチェックだけでは埋め込みを検証できない。**このジョブが
            # 検出すべきWindows固有の問題の中心がここであり、実際に1本
            # 取ってこないと素通りする。
            $css = Invoke-WebRequest -Uri "http://127.0.0.1:8080/assets/dioryga.css" `
              -UseBasicParsing -TimeoutSec 5
            if ($css.StatusCode -ne 200) {
              throw "静的アセットが配信されません (status: $($css.StatusCode))"
            }
            if ($css.Content -notmatch '--accent') {
              throw "静的アセットの中身が期待と異なります"
            }
            Write-Host "静的アセットを配信しました: $($css.RawContentLength) bytes"
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

  macos-build:
    name: Macビルド確認
    runs-on: macos-latest
    # **毎回は走らせない。**macOSランナーはUbuntuの7.75倍の単価で、実測すると
    # 67秒しか使っていないのにCI費用の61%を占めていた（しかも分単位の切り上げで
    # 実質2分ぶん課金されるため、速くしても効かない）。
    #
    # 一方で守備範囲は狭い。依存はすべてクロスプラットフォームなpure Rustであり、
    # **開発機がMacで日常的にビルドしている**ため、macOS固有の破損は数分で気付く。
    # releaseプロファイル固有の問題も、windows-smokeの `[profile.ci]`
    # （`debug-assertions = false`）が毎回検証している。
    #
    # よって、配布物を実際に建てるリリースタグ時と、環境ドリフトを拾う週次、
    # および手動実行に絞る。
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == env.SAVE_CACHE_ON }}

      # 配布物としての最終ビルド確認（設計書2章）。
      - name: cargo build --release
        run: cargo build --release --locked

      # **配布物に開発専用の自動ログインが入っていないこと**（#128）。
      # 目印は src/auth/dev_autologin.rs の MARKER
      - name: 自動ログインが含まれていないこと
        run: |
          if grep -a -q "DIORYGA-DEV-AUTOLOGIN-ENABLED" target/release/dioryga; then
            echo "::error::開発専用の自動ログインが配布物に含まれています"
            exit 1
          fi
          echo "含まれていません"
