[workspace]
resolver = "2"
members = ["crates/dioryga", "crates/entity", "crates/migration"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/volanja/Dioryga"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
# multipart は取込UIのファイルアップロードで使う（既定では入らない）
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
sea-orm = { version = "2.0", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-chrono",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-chrono",
] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

entity = { path = "crates/entity" }
migration = { path = "crates/migration" }

# CIのWindows起動スモークテスト専用。**配布物のビルドには使わない。**
#
# このジョブが検出したいのはWindows固有の問題（パス区切り・ファイルロック・
# 静的アセットの展開）であり、最適化されたコード生成ではない。opt-level 3 の
# ままでは同じ3クレートのコンパイルにmacOSの3倍かかっていた。
#
# **`debug-assertions = false` がこのプロファイルの要。**rust-embed は
# `debug_assertions` が有効なときファイルシステムから読むため、これを外すと
# 静的アセットの埋め込みを検証しなくなり、ジョブの主目的が失われる。
# `inherits = "release"` の既定でもfalseだが、載っている意味が大きいため明示する。
#
# 引き換えに、リリース最適化のコード生成・リンクがWindowsで通るかは検証しない
# （macビルド確認が本物の `--release` を維持している）。
[profile.ci]
inherits = "release"
opt-level = 0
codegen-units = 256
debug-assertions = false
