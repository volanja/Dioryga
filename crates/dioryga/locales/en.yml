  ip_addresses_lead: Every IP address currently assigned to a device in this project
  address: Address
  prefix: Prefix length
  subnet: Subnet
  no_ip: No IP addresses registered
  interfaces: Interfaces
  interfaces_lead: Records how each port appears to the OS, what network it reaches, and what job it does
