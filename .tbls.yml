# スキーマドキュメントの生成設定（設計書2章）。
#
# **マイグレーション適用後の実DBから生成する。**手書きの定義から作ると、
# マイグレーションとの食い違いに気付けないため。
#
# 生成は `scripts/schema-docs.sh` で行い、CIが陳腐化を検出する。
#
# ## なぜPostgreSQLから生成するか
#
# スキーマはDBごとに分岐しない方針（設計書24.2）なので、どちらから生成しても
# テーブル・カラム・外部キーの構造は同じになる。**表示される型だけが変わる**
# （PostgreSQLは `character varying`、SQLiteは `text`）。チーム運用の想定が
# PostgreSQLである（2章）ため、そちらの型を出す。
#
# ## コメントについて
#
# `comments:` に書いた内容が生成物へ入る。**DBにコメントを付けない**のは、
# マイグレーションをコメントのためだけに書き換えたくないため。「なぜそうなって
# いるか」の詳細は設計リポジトリにあり、ここには**読み違えると壊れる点**だけを置く。

dsn: ${TBLS_DSN}
docPath: docs/schema

# sea-ormが管理する内部テーブル。設計の対象ではない
exclude:
  - seaql_migrations

lint:
  # **新しいテーブルを足したらコメントを書く**という強制。設計意図を
  # 書かないまま増やすと、この文書が単なるカラムの羅列になる
  requireTableComment:
    enabled: true
  # 全列に求めると機械的な記述で埋まり、かえって読み飛ばされる
  requireColumnComment:
    enabled: false
  # **外部キー列にインデックスが無いと落とす。**両DBとも自動では張らないため
  # （設計書24.3）、張り忘れは実際に起きる
  requireForeignKeyIndex:
    enabled: true
    exclude:
      # 作成者は検索条件にしない。索引を作っても使われない
      - public.vendor.created_by
      - public.chassis_model.created_by
      - public.part_catalog.created_by
      - public.configuration.created_by
      - public.cable_catalog.created_by
      - public.software_catalog.created_by
      - public.warehouse.created_by
      - public.mount_container.created_by
      - public.audit_log.user_id
      - public.firmware_version.changed_by

format:
  sort: false
  # 生成物の差分をレビューしやすくするため、番号は振らない
  number: false

er:
  format: svg
  # 隣接するテーブルまでを1枚に描く。全体図はREADMEにある
  distance: 1

comments:
  # --- 基盤 -----------------------------------------------------------------
  - table: app_user
    tableComment: |
      利用者。設計書の `USER`。`user` はPostgreSQLの予約語のため物理名を変えている（24.2.4）。
      物理削除はせず `disabled_at` で無効化する（20.11）。AUDIT_LOG等から参照されるため。
    columnComments:
      disabled_at: null = 有効。**物理削除の代わり。**
      is_system_admin: プロジェクトロールとは別軸。**真の利用者はプロジェクトデータに一切アクセスできない**（3章）
      must_change_password: 一時パスワード発行時に真。変更を終えるまで他の画面へ進めない（20.6）

  - table: project
    tableComment: |
      プロジェクト。**サービスの開始日・終了日と進行状態を持たない**（5.1）。
      それらは MILESTONE から導出する。ここに日付を持つと「予定と実績の差」が失われる。
    columnComments:
      uid: Diorygaが採番する不変の識別子。名前を変更しても参照が切れない（5.3）
      code: 組織のプロジェクトコード。**未設定は空文字ではなくNULL**（UNIQUEのため、空文字だと2件目が作れない）
      archived_at: サービス上の終了ではなく、**一覧から外すという運用判断**（5.2）
      closure_reason: Completed / Cancelled。中止と完了を区別しないと納期遵守率の集計が汚れる（10.4）
      currency: 集計通貨。**金額の小数点以下の桁数がこの値から決まる**（24.2.1）

  - table: project_member
    tableComment: |
      利用者とプロジェクトの対応。粒度は `(user_id, project_id, role)`。
      **同一利用者が同一プロジェクトで複数ロールを兼務できる**（5章）。
    columnComments:
      admin_rank: Primary / Secondary。role=Administrator のときのみ意味を持つ。1プロジェクトにつき各1名まで

  - table: session
    tableComment: セッション。生のトークンは保存せずハッシュのみを持つ（20.5）。
  - table: login_attempt
    tableComment: |
      ログイン試行。レート制限に使う。**存在しない利用者への試行も記録する**ため
      app_user への外部キーを持たない（20.4）。
  - table: audit_log
    tableComment: |
      監査ログ。全ての書き込みがリポジトリ層を通り、同一トランザクション内で記録される（15.2、24.4）。
      **認証情報の平文を含めない**（不変条件8）。
    columnComments:
      import_run_id: 一括取込による変更。取込では行ごとの監査ログを書かず、これで追跡する（24.4）

  - table: import_run
    tableComment: |
      取込の実行記録（23.7）。**「この不正なデータはどの取込で入ったか」を辿る**ためにある。
      取込では行ごとの監査ログを書かないため（24.4）、追跡はこのテーブルが担う。
    columnComments:
      project_id: カタログ取込はプロジェクトに属さないため null（18.1）
      file_hash: 同じファイルを二度流したかを後から判別できるようにする
      as_of: マニフェストで宣言された基準時刻。履歴行の `from_date` に使う（23.1）

  # --- 共有カタログ ---------------------------------------------------------
  - table: vendor
    tableComment: |
      ベンダーのマスタ。**名称の表記ゆれを防ぐために存在する**（18.3）。
      **18.2の「参照されたら編集不可」は適用しない**——誤字訂正は構成そのものを変えないため。
    columnComments:
      retired_at: |
        廃番（18.5）。null = 現役。**参照済みでも設定できる**——18.2が禁じているのは
        スペックを定義するフィールドの編集であり、選択可否はスペックではない
  - table: chassis_model
    tableComment: 筐体モデル。自然キーは `(vendor_id, model_name)`。**別ベンダーなら同じ型番を持てる**（6.2）。
    columnComments:
      height_u: ラック搭載時の高さ。mount_form=Surface では意味を持たない
      rack_width: Full / Half。mount_form=RackU のときのみ意味を持つ
  - table: chassis_slot
    tableComment: |
      筐体モデルが持つスロット。**無条件の一覧である。**「4CPU構成でなければ使えない」といった
      条件付き制約は表現しない（6.1で対応しないと決着済み）。
  - table: configuration
    tableComment: 筐体モデルに対する構成（6.2）。
    columnComments:
      current_type: |
        その構成で**実際に使う**給電方式（12.8）。カタログでは決まらないためここに持つ
      assumed_voltage: 想定電圧（V）。**DCは負値をとりうる**
      assumed_va: |
        引くと見込む皮相電力。**ワットではない**——ブレーカーに効くのは皮相電力（12.7）。
        **電流は保存しない**（A = VA ÷ V で求める）
  - table: configuration_part
    tableComment: 構成に含まれる部品。同じ部品を複数行に分けず `quantity` で表す。
  - table: part_catalog
    tableComment: |
      部品カタログ。**集計に使う値だけをカラム化する**ハイブリッド方針（6.4）。
    columnComments:
      core_count: 横断集計の対象のため実カラム。該当しない部品では null
      capacity_gb: 同上
      spec_json: 集計しない仕様。**JSONは文字列で持つ**（24.2.3。jsonb固有演算子を使わないため）
  - table: part_port_slot
    tableComment: 部品が備えるポート（8.3、8.7）。
    columnComments:
      port_speed: port_kind=Network のときのみ意味を持つ
  - table: port_power_rating
    tableComment: |
      ポートが受け付ける給電方式と定格電圧（12.7）。**給電方式ごとに1行。**
      交流と直流の双方を受けるPSUが実在するため、`PART_PORT_SLOT` の列にはできない。
    columnComments:
      voltage_min: |
        **DCは負値をとりうる。**絶対値ではなく符号を含めた大小で扱う
        （-48V電源は -72 が下限、-40 が上限）
      voltage_max: 同上
  - table: cable_catalog
    tableComment: ケーブルのカタログ（8.3）。**v1では画面・取込の対象外**だが定義は持つ。
    columnComments:
      length_mm: |
        **ミリメートルの整数。**SQLiteに DECIMAL が無いため（24.2.1）。
        単位を列名に含めているのは1000倍の取り違えを防ぐため
  - table: cable_end_slot
    tableComment: |
      ケーブルの端。**端ごとに異なるコネクタを持てる**（8.7）。
      NEMA 5-15P と C13、LC と SC のような非対称なケーブルを表すため両端を別レコードにしている。
  - table: software_catalog
    tableComment: |
      ソフトウェアのカタログ。**SBOM取込はこのテーブルを自動生成しない**（9.2）。
      人が資産として登録したものだけを置く。
    columnComments:
      purl: あればこれが一意。**NULL同士は重複と見なされない**ため、持たない行は何件でも共存する

  # --- 機器 -----------------------------------------------------------------
  - table: device
    tableComment: |
      機器。**`in_stock` / `disposed` は `status` に持たない**（旧B-1）。
      所在は DEVICE_ASSIGNMENT から導出する。状態を二重に持つと必ずずれる。
    columnComments:
      uid: 登録時に採番する不変の識別子。取込時の突合に使う（23.2）
      external_id: 取込元システムでの識別子。再取込時の突合用
      merged_into_device_id: |
        重複統合で吸収された場合の統合先。**削除ではなくリダイレクト**（23.9）
      device_type: Physical / Virtual / Container / **Logical**。Logical は複数の筐体が1台として振る舞うもの
      device_category: "`configuration_id` が無い機器（仮想アプライアンス等）の分類"
      serial_number: Virtual / Container には存在しない（6.2）
      asset_number: |
        **nullable。**組織によっては申請から採番まで時間がかかり、
        番号が届くまで登録できないのは実務上成立しない（23.2）
      status: running / broken / repair / plan / building。**所在は含まない**

  - table: device_assignment
    tableComment: |
      機器の所在 — **履歴テーブル。**`to_date IS NULL` が現在有効な行であり、
      既存行を更新せず「閉じて開く」（不変条件1）。
    columnComments:
      location_type: Warehouse / Project / Disposed。**多態的参照のため外部キーを持てない**（旧C-7）
      location_id: Disposed のときは null
      work_order_id: この変更を引き起こしたWORK_ORDER（11章）。**WORK_ORDER未作成のため外部キーは未設定**
      to_date: null が現在有効な行

  - table: part_instance
    tableComment: 部品の実物（6.2）。
  - table: part_instance_location
    tableComment: 部品の所在 — 履歴テーブル（6.2、12.4）。
    columnComments:
      chassis_slot_id: |
        **任意項目。**どのスロットに挿さっているかまでは求めない（6.2）。
        求めると取込のたびに実機を開けることになる
      to_date: null が現在有効な行
  - table: firmware_version
    tableComment: ファームウェアの版 — 履歴テーブル（6.2）。
    columnComments:
      item_type: Device / PartInstance。**多態的参照のため外部キーを持てない**
      to_date: null が現在有効な行
  - table: device_stack
    tableComment: |
      スタック構成 — 履歴テーブル（8.6）。スタック全体を `device_type="Logical"` の DEVICE として
      登録し、物理筐体は `Physical` として別に登録する。hostname や OS_INTERFACE は論理側、
      DEVICE_MOUNT や power_watt は物理側が持つ。
    columnComments:
      to_date: null が現在有効な行

  # --- ネットワーク ---------------------------------------------------------
  - table: vlan
    tableComment: |
      VLAN（8.3）。**一意制約を張っていない。**VLANタグはL2ドメインごとに独立しており、
      拠点が違えば同じタグを使える。
    columnComments:
      zone: DMZ / WAN / LAN / Management / Isolated。セキュリティ境界（8.5）。SUBNET側にも持つ
  - table: subnet
    tableComment: |
      サブネット（14.1）。**プロジェクト単位に分ける**ことで、異なるプロジェクトが
      同じプライベートアドレス帯を独立に使っていても衝突しない（14.2）。
    columnComments:
      project_id: 共有バックボーン等は null
      zone: VLAN側にも持つ。**両方あるときはこちらを優先する**（14.2）
  - table: os_interface
    tableComment: |
      OSから見えるインターフェース — 履歴テーブル（8.3、8.5）。
      **物理ポートではなくこちらを中心に置く。**ボンド・VLANサブインターフェース・SVI・
      VMの仮想NICは物理ポートに1対1で対応しない。
    columnComments:
      device_id: |
        **必須。**物理ポートを持たないインターフェースがあり、ポートから機器を導出できない（8.3）
      part_instance_id: interface_type=Physical のときのみ意味を持つ
      port_slot_id: 同上
      aggregation_mode: LACP / Static / ActiveBackup。interface_type=Bond のみ
      to_date: null が現在有効な行
  - table: interface_stack
    tableComment: |
      インターフェースの積み重ね — 履歴テーブル（8.5）。
      **ボンド（1 upper : N lower）とVLANサブインターフェース（1 lower : N upper）の双方を
      扱うため中間テーブルにしている。**向きが逆なので片方向の外部キーでは表せない。
    columnComments:
      to_date: null が現在有効な行
  - table: interface_vlan
    tableComment: インターフェースに載るVLAN — 履歴テーブル（8.3、8.6）。
    columnComments:
      tagging_mode: Untagged（ポートVLAN）/ Tagged（タグVLAN）
      to_date: null が現在有効な行
  - table: interface_role
    tableComment: |
      インターフェースの役割 — 履歴テーブル（8.5）。バックアップ用・vMotion用など目的別の区別で、
      セキュリティ境界を表す `zone` とは**別軸**である。
    columnComments:
      to_date: null が現在有効な行
  - table: ip_address
    tableComment: |
      IPアドレス — 履歴テーブル（8.3、8.6、14章）。**`vlan_id` を持たない**（インターフェース
      側から辿る。8.6で廃止）。同一サブネット内の重複は部分インデックスで禁じている（14.2）。
    columnComments:
      subnet_id: |
        null の行は重複禁止の対象外になる（NULL同士は重複と見なされない）
      to_date: null が現在有効な行
  - table: cable_instance
    tableComment: |
      ケーブルの実物（8.3）。**機器と違い所在の履歴を持たない**ため、
      in_stock / disposed も status に含む。v1では画面・取込の対象外。
  - table: cable_connection
    tableComment: |
      ケーブルの接続 — 履歴テーブル（8.3）。**`device_id` を持たない**
      （PART_INSTANCE_LOCATION 経由で導出する。持つと部品の移設時に二重管理になる）。
    columnComments:
      cable_end_slot_id: どちらの端か。両端が非対称なケーブルがあるため端ごとに持つ（8.7）
      to_date: null が現在有効な行

  # --- QCD（費用・マイルストーン） -------------------------------------------
  #
  # **金額はすべて最小通貨単位の整数**（24.2.1）。SQLiteにDECIMALが無く、
  # REALでは丸め誤差が累積するため。桁数は PROJECT.currency から決まる。
  - table: purchase_order
    tableComment: |
      発注（10章）。**`amount` を持たない**——明細の合計から計算する（旧B-5）。
      持つと明細と合計がずれ、どちらが正か分からなくなる。
  - table: purchase_order_item
    tableComment: 発注明細（10章）。
    columnComments:
      item_type: Device / PartInstance / SoftwareInstance。**多態的参照のため外部キーを持てない**
      unit_price: |
        **最小通貨単位の整数**（24.2.1）。DECIMALにしない
  - table: fixed_asset
    tableComment: |
      固定資産（10章）。**`disposal_date` と簿価を持たない**——廃棄は
      DEVICE_ASSIGNMENT の Disposed 行から、簿価は取得価額と経過期間から計算する
      （旧B-1）。持つと二重管理になり必ずずれる。
    columnComments:
      acquisition_cost: "**最小通貨単位の整数**（24.2.1）"
      depreciation_method: straight_line / declining_balance
  - table: maintenance_contract
    tableComment: 保守契約（10章）。
    columnComments:
      end_date: "**保守期限はこの列のみが正**（旧B-2）。機器側に保守期限を持たない"
      amount: "**最小通貨単位の整数**（24.2.1）"
  - table: maintenance_contract_item
    tableComment: 保守契約の対象（10章）。多態的参照のため外部キーを持てない。
  - table: recurring_cost
    tableComment: 定期費用（10章）。ラック料金・回線費用など。
    columnComments:
      item_type: MountContainer / Project
      amount: "**最小通貨単位の整数**（24.2.1）"
      billing_cycle: Monthly / Annual
      end_date: null = 継続中
  - table: milestone
    tableComment: |
      マイルストーン（10.4）。**予定と実績を別の列で持つ。**片方に上書きすると
      「当初いつの予定だったか」が失われ、QCDの「D」を定量的に見られなくなる（5.1）。
    columnComments:
      planned_date: "**`date` のまま。**同日内の順序を問わないため（C-5）"
      milestone_type: ServiceStart / ServiceUpdate / ServiceMaintenance / ServiceEnd
  - table: milestone_device
    tableComment: マイルストーンと機器の対応（10.4）。
    columnComments:
      change_type: addition / relocation / removal
      work_order_id: "**WORK_ORDER未作成のため外部キーは未設定**"

  # --- 物理設置 -------------------------------------------------------------
  - table: warehouse
    tableComment: 倉庫。プロジェクトを横断する未割当機器の置き場（12章）。
  - table: mount_container
    tableComment: 機器を載せる什器（12章）。
    columnComments:
      location_type: Warehouse / Project。多態的参照のため外部キーを持てない
      capacity: |
        ラックのU数、棚の段数。**制約ではなく目安。**超過はエラーではなく警告として扱う（不変条件6）
  - table: device_mount
    tableComment: |
      機器の搭載位置 — 履歴テーブル（12.2、13.2）。
      **1行で `container_id` と `host_device_id` のどちらか一方だけが埋まる。**
      この排他はDB制約にせず、アプリケーション層で検証する。
    columnComments:
      container_id: 什器に直接搭載する場合。`host_device_id` とは排他
      host_device_id: 他の機器の上に載る場合（棚板、VMの実行ホスト）。`container_id` とは排他
      position: Rack なら開始U番号、Shelving なら段番号
      to_date: null が現在有効な行

  # --- 変更管理 -------------------------------------------------------------
  - table: work_order
    tableComment: |
      変更管理チケット（11章）。**`work_order_id` を持つ履歴テーブルからの外部キーは存在しない**（24.3）。
      SQLiteが後から制約を足せないため。参照整合はアプリケーション層と `dioryga check` で担保する。
    columnComments:
      target_project_id: work_type=Transfer の移譲先。それ以外では null
      status: |
        planned / approved / executing / completed / aborted。
        **`approved` は WORK_ORDER_APPROVAL の全行が approved になった結果**であり、単独では動かさない
      due_date: 期日。**実績の `completed_at` とは別に持つ**（5.1。上書きすると予定と実績の差が失われる）
      primary_assignee_id: 主担当。**この人物は自分のチケットを承認できない**（旧C-9、DB制約にできないためアプリケーション層で検証）
  - table: work_order_approval
    tableComment: |
      変更の承認（11章）。**影響を受けるプロジェクトごとに1行を起こす。**
      他プロジェクトの機器を巻き込む変更（移設・移譲）では複数必要になる。
    columnComments:
      required_project_id: どのプロジェクトの承認か
      approver_id: 承認前は null。誰が承認したかは押した時点で決まる
      status: pending / approved / rejected
      self_approved: |
        **承認者が自分自身だった**（11.4-9、22章R-2）。他に承認できる人がいない場合に限り許される。
        導出可能に見えるが、承認当時に他の承認者がいなかったという事実は後から人が増えると再現できない

  # --- ソフトウェア・SBOM ---------------------------------------------------
  - table: software_instance
    tableComment: |
      ソフトウェアの固有のインストール単位（9.3）。**バージョンアップを跨いで引き継がれる固有情報**を持つ。
      **`status` を持たない**（9.4.1）。インストール状態は SOFTWARE_INSTALLATION から導出する。
    columnComments:
      retired_at: |
        null = 保有中。**導出できないのはここだけ。**
        未インストールの在庫と失効済みは、インストール履歴からは区別がつかない
  - table: software_installation
    tableComment: |
      ソフトウェアのインストール — **履歴テーブル**（9.4）。`to_date IS NULL` が現在有効な行。
      **1つのインスタンスが同時に2台へ入ることはない**ため現行行に部分ユニークを張る。
    columnComments:
      work_order_id: |
        11章。**先行して作った履歴テーブルと違い、ここは外部キーを張れている**（24.3）
      to_date: null が現在有効な行
  - table: software_role_assignment
    tableComment: |
      ソフトウェアの役割 — 履歴テーブル（9.9）。**SBOM取込の対象外で、常に運用者が画面上で設定する。**
      1つのインストールに複数のroleを付与できる（dnsmasqのようにDNSとDHCPを兼ねる場合）。
    columnComments:
      to_date: null が現在有効な行
  - table: sbom_snapshot
    tableComment: |
      SBOMのスナップショット（9.7）。**本システムで唯一、代理キーを持たないテーブル。**
      主キーは正規化後の内容のSHA-256で、**同一内容は1件しか保存しない。**
      ゴールデンイメージが同じ機器が何台あっても実体は1つであり、保存量が台数に比例しない。
    columnComments:
      content: zstdで圧縮した正規化済みコンポーネント一覧。**内側の形式はJSONのまま**（デバッグ容易性を優先）
  - table: sbom_import
    tableComment: |
      SBOMの取込記録（9.5）。**`superseded_at` は他の履歴テーブルの `to_date` と同じ役割**を果たす。
      **取込は SOFTWARE_INSTANCE も VENDOR も自動生成しない**（9.6。資産管理の判断は人が行う）。
    columnComments:
      superseded_at: null = そのDeviceの最新の観測結果
  - table: sbom_component_change
    tableComment: |
      直前の取込との差分（9.5）。**SBOM取込の目的はこれを記録すること**であり、
      コンポーネント1件ごとの集計は要件ではない（9.2）。構成に変化がなければ0件。
    columnComments:
      purl: 差分計算時の同一性判定キー。**無いコンポーネントは `name` で代替する**（9.6）
  - table: sbom_component_index
    tableComment: |
      機器横断のコンポーネント検索用の索引（9.8）。**再構築可能な派生索引であり、真実の源は SBOM_SNAPSHOT。**
      **`content_hash` 単位に張る（Device単位にしない）。**Device単位だと3,000万行になる。
