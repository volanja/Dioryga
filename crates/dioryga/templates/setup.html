{% extends "auth_layout.html" %}
{% block title %}{{ t_title }}{% endblock %}
{% block content %}
<h1>{{ t_title }}</h1>
<p class="lead">{{ t_lead }}</p>

{% if let Some(message) = error %}
<p class="error">{{ message }}</p>
{% endif %}

<form method="post" action="/setup">
  <label for="token">{{ t_token }}</label>
  <input type="text" id="token" name="token" required autocomplete="off">
  <p class="hint">{{ t_token_hint }}</p>

  <label for="name">{{ t_name }}</label>
  <input type="text" id="name" name="name" required>

  <label for="email">{{ t_email }}</label>
  <input type="email" id="email" name="email" autocomplete="username" required>

  <label for="password">{{ t_password }}</label>
  <input type="password" id="password" name="password"
         autocomplete="new-password" required>

  <button type="submit">{{ t_submit }}</button>
</form>
{% endblock %}
