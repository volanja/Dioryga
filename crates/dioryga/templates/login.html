{% extends "auth_layout.html" %}
{% block title %}{{ t_title }}{% endblock %}
{% block content %}
<h1>{{ t_title }}</h1>
<p class="lead">{{ t_lead }}</p>

{% if let Some(message) = error %}
<p class="error">{{ message }}</p>
{% endif %}

<form method="post" action="/login">
  <label for="username">{{ t_username }}</label>
  <input type="text" id="username" name="username" autocomplete="username" required
         autocapitalize="none" spellcheck="false" value="{{ username }}">

  <label for="password">{{ t_password }}</label>
  <input type="password" id="password" name="password"
         autocomplete="current-password" required>

  <button type="submit">{{ t_submit }}</button>
</form>
{% endblock %}
