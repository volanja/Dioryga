{% extends "app_layout.html" %}
{% block title %}{{ t_title }}{% endblock %}
{% block content %}

<div class="page-head">
  <div>
    <h1>{{ t_title }}</h1>
    <p class="lead">{{ t_lead }}</p>
  </div>
  <a class="button ghost" href="/admin/users">{{ t_back }}</a>
</div>

{% if let Some(message) = error %}
<p class="error">{{ message }}</p>
{% endif %}

<form class="card form" method="post" action="{{ action }}">
  <input type="hidden" name="csrf_token" value="{{ chrome.csrf_token }}">

  <label for="name">{{ t_name }}</label>
  <input type="text" id="name" name="name" value="{{ name }}" required>

  <label for="email">{{ t_email }}</label>
  <input type="email" id="email" name="email" value="{{ email }}"
         autocomplete="off" required>

  <label for="locale">{{ t_locale }}</label>
  <select id="locale" name="locale">
    <option value="ja" {% if locale_value == "ja" %}selected{% endif %}>日本語</option>
    <option value="en" {% if locale_value == "en" %}selected{% endif %}>English</option>
  </select>

  <div class="check">
    <input type="checkbox" id="is_system_admin" name="is_system_admin" value="on"
           {% if is_system_admin %}checked{% endif %}>
    <label for="is_system_admin">{{ t_is_system_admin }}</label>
  </div>
  <p class="hint">{{ t_system_admin_hint }}</p>

  <button type="submit">{{ t_submit }}</button>
</form>

{% endblock %}
