  done_part: "Merged %{from} into %{to} (%{count} rows repointed)"
  error_same: The absorbed and the kept entry cannot be the same
  error_cycle: That would create a merge cycle
  error_spec: The specs do not match, so these cannot be merged. Folding different things together corrupts aggregation
  error_conflict: "The target already has the same %{kind} (%{name}). Resolve that one first"

